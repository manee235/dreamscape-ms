<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#131926"/>
      <stop offset="100%" stop-color="#0f141f"/>
    </linearGradient>
    <linearGradient id="mintGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d293"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="#232d42" stroke-width="4"/>
  
  <!-- Architectural Compass Icon -->
  <g transform="translate(106, 106)" filter="url(#glow)">
    <circle cx="150" cy="150" r="130" fill="none" stroke="url(#mintGrad)" stroke-width="18"/>
    <polygon points="150,45 185,150 150,130 115,150" fill="#00d293"/>
    <polygon points="150,255 185,150 150,170 115,150" fill="#3b82f6"/>
    <circle cx="150" cy="150" r="16" fill="#0f141f" stroke="#00d293" stroke-width="6"/>
  </g>
</svg>

